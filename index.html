<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Scan jacuzzi serienummers met OCR technologie">
    <meta name="theme-color" content="#667eea">

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Jacuzzi Scanner">

    <title>Jacuzzi Serienummer Scanner</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link rel="stylesheet" href="styles.css">
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
</head>
<body>
    <div class="container">
        <h1>Jacuzzi Serienummer Scanner</h1>

        <div class="card">
            <h2>Scan Serienummer</h2>

            <!-- Camera Section -->
            <div class="camera-section">
                <video id="camera" autoplay playsinline></video>
                <canvas id="canvas" style="display: none;"></canvas>

                <div class="button-group">
                    <button id="startCamera" class="btn btn-primary">
                        📷 Start Camera
                    </button>
                    <button id="captureBtn" class="btn btn-success" style="display: none;">
                        📸 Maak Foto
                    </button>
                    <button id="stopCamera" class="btn btn-secondary" style="display: none;">
                        ⏹ Stop Camera
                    </button>
                </div>
            </div>

            <!-- Preview Section -->
            <div id="previewSection" style="display: none;">
                <h3>Gemaakte Foto</h3>
                <img id="preview" alt="Preview">
                <button id="retakeBtn" class="btn btn-secondary">
                    🔄 Nieuwe Foto
                </button>
            </div>

            <!-- OCR Progress -->
            <div id="ocrProgress" style="display: none;">
                <div class="progress-bar">
                    <div id="progressBar" class="progress-fill"></div>
                </div>
                <p id="ocrStatus">OCR wordt uitgevoerd...</p>
            </div>

            <!-- Form Section -->
            <div class="form-section">
                <h2>Gegevens</h2>

                <div class="form-group">
                    <label for="serialNumber">Serienummer</label>
                    <input
                        type="text"
                        id="serialNumber"
                        placeholder="Automatisch gevuld via OCR"
                        class="form-input">
                </div>

                <div class="form-group">
                    <label for="customerNumber">Klantnummer</label>
                    <input
                        type="text"
                        id="customerNumber"
                        placeholder="Voer klantnummer in"
                        class="form-input">
                </div>

                <button id="submitBtn" class="btn btn-primary btn-large">
                    ✅ Opslaan
                </button>
            </div>

            <!-- Result Section -->
            <div id="resultSection" style="display: none;">
                <div class="result-box">
                    <h3>✅ Gegevens Opgeslagen</h3>
                    <p><strong>Serienummer:</strong> <span id="savedSerial"></span></p>
                    <p><strong>Klantnummer:</strong> <span id="savedCustomer"></span></p>
                    <button id="newEntryBtn" class="btn btn-secondary">
                        Nieuwe Invoer
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
